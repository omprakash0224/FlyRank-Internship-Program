server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Proxy API requests to the Express backend ──────────────────────────────
    # The backend service is named "app" in docker-compose and listens on :3000.
    location /api/ {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;

        # Required for SSE (Server-Sent Events) — disable buffering
        proxy_buffering        off;
        proxy_cache            off;
        proxy_set_header       Connection '';
        chunked_transfer_encoding on;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for long-lived SSE connections
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── React SPA — serve index.html for all non-file routes ──────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ──────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
