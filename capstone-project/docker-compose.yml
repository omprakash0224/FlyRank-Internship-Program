services:

  # ── Backend: Express API ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Frontend: React SPA served by Nginx ───────────────────────────────────────
  # Nginx serves the Vite-built static files and proxies /api/* → app:3000
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

# PostgreSQL is hosted on Neon   → no local container needed
# Redis is hosted on Upstash     → no local container needed
# Configure DATABASE_URL and UPSTASH_REDIS_REST_* in .env
