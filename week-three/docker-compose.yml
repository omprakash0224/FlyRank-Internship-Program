services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taskdb
    volumes:
      - pgdata:/var/lib/postgresql/data          # persistent data volume
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # auto-run on first start
    ports:
      - "5432:5432"   # expose for local tools (TablePlus, psql, etc.)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Node.js App ──────────────────────────────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    env_file: .env                               # loads DATABASE_URL and PORT
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy               # wait for Postgres to be ready

volumes:
  pgdata:   # named volume — survives container restarts and re-creates
